services:
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./market.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UVICORN_RELOAD: "true"
      UVICORN_WORKERS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  scheduler:
    profiles: ["scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./market.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app

  frontend:
    image: node:18-alpine
    working_dir: /app
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GA_ID: ${VITE_GA_ID:-G-50NDCBKGYM}
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm dev --host 0.0.0.0 --port 5173"
